<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Section Leader HQ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Section Leader HQ</h1>
  <p id="message"></p>

  <section id="auth" class="hidden">
    <h2>Log in</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password (6+ characters)">
    <button id="loginBtn">Log in</button>
    <button id="signupBtn">Sign up</button>
  </section>

  <section id="setup" class="hidden">
    <h2>Join your band</h2>
    <input id="joinCode" placeholder="Join code from your director">
    <input id="joinName" placeholder="Your full name">
    <select id="joinSection"></select>
    <input id="joinInstrument" placeholder="Instrument (e.g. Alto Sax)">
    <button id="joinBandBtn">Join band</button>

    <h3>Or start a new band (directors)</h3>
    <input id="bandName" placeholder="Band name">
    <input id="myName" placeholder="Your full name">
    <button id="createBandBtn">Create band</button>
    <button id="setupLogoutBtn">Log out</button>
  </section>

  <section id="home" class="hidden">
    <h2 id="welcome"></h2>

    <div id="goalForm" class="hidden">
      <h3>Assign a goal</h3>
      <select id="goalSection"></select>
      <textarea id="goalText" placeholder="e.g. Clean up mm. 40-48 at 120 bpm"></textarea>
      <button id="addGoalBtn">Assign goal</button>
    </div>

    <h3>Rehearsal goals</h3>
    <div id="goalList"></div>

    <div id="itemForm" class="hidden">
      <h3>Add a pass-off item</h3>
      <input id="itemTitle" placeholder="Title (e.g. Opener, mm. 1-32)">
      <input id="itemMovement" placeholder="Movement (e.g. Movement 1)">
      <input id="itemMeasures" placeholder="Measures (e.g. 1-32)">
      <input id="itemDue" type="date">
      <button id="addItemBtn">Add item</button>
    </div>

    <h3>Pass-off board</h3>
    <div id="passOffList"></div>

    <h3>Attendance</h3>
    <input id="attDate" type="date">
    <p id="attSummary" class="small"></p>
    <div id="attList"></div>

    <div id="rosterBox" class="hidden">
      <h3>Roster</h3>
      <div id="inviteBox" class="hidden card">
        <p class="small">Join code (give this to your members):</p>
        <p id="joinCodeText" class="code">none yet</p>
        <button id="newCodeBtn">Generate new code</button>
      </div>
      <div id="rosterList"></div>
    </div>

    <button id="logoutBtn">Log out</button>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
